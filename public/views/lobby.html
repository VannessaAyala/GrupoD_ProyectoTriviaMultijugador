<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Trivia Live - Lobby</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="container py-5">

        <div class="main-card">

            <!-- HEADER -->
            <div class="title text-center mb-5">

                <h1>
                    🎮 LOBBY
                </h1>

                <p>
                    Esperando jugadores para iniciar la partida
                </p>

            </div>

            <!-- INFO -->
            <div class="row g-4 mb-5">

                <!-- PLAYERS -->
                <div class="col-md-4">

                    <div class="panel text-center">

                        <h3 class="mb-3">
                            👥 Jugadores
                        </h3>

                        <h1 id="playersCount">
                            0
                        </h1>

                    </div>

                </div>

                <!-- STATUS -->
                <div class="col-md-4">

                    <div class="panel text-center">

                        <h3 class="mb-3">
                            🟢 Estado
                        </h3>

                        <h1 id="statusText">
                            Lobby
                        </h1>

                    </div>

                </div>

                <!-- MODE -->
                <div class="col-md-4">

                    <div class="panel text-center">

                        <h3 class="mb-3">
                            🏆 Modo
                        </h3>

                        <h1>
                            Trivia
                        </h1>

                    </div>

                </div>

            </div>

            <!-- PLAYERS GRID -->
            <div class="panel mb-5">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>
                        👥 Jugadores conectados
                    </h2>

                    <span class="badge bg-success p-3 fs-6">
                        EN VIVO
                    </span>

                </div>

                <div class="row"
                    id="playersGrid">

                </div>

            </div>

            <!-- WAIT -->
            <div class="panel text-center">

                <h2 class="mb-4">
                    🚀 Esperando inicio del administrador
                </h2>

                <div class="timer-container mx-auto mb-4">

                    <div style="
                        width:100%;
                        height:100%;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        font-size:70px;
                    ">
                        🎮
                    </div>

                </div>

                <p class="fs-4 text-secondary">

                    El juego iniciará cuando
                    el administrador escriba START

                </p>

            </div>

        </div>

    </div>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        // ======================================================
        // SOCKET
        // ======================================================

        const socket = io();

        // ======================================================
        // OBTENER JUGADOR
        // ======================================================

        function obtenerJugador() {

            try {

                const data =
                    localStorage.getItem('trivia_player');

                if (!data) return null;

                return JSON.parse(data);

            } catch (error) {

                console.log(error);

                return null;
            }
        }

        // ======================================================
        // VALIDAR LOGIN
        // ======================================================

        const jugador = obtenerJugador();

        if (!jugador || !jugador.nombre) {

            window.location.href =
                '/views/login.html';
        }

        // ======================================================
        // JOIN
        // ======================================================

        socket.on('connect', () => {

            socket.emit(
                'join_lobby',
                jugador.nombre
            );
        });

        // ======================================================
        // ACTUALIZAR JUGADORES
        // ======================================================

        socket.on('update_players', (players) => {

            const playersCount =
                document.getElementById('playersCount');

            const playersGrid =
                document.getElementById('playersGrid');

            playersGrid.innerHTML = '';

            playersCount.innerText =
                players.length;

            (players || []).forEach((p, index) => {

                playersGrid.innerHTML += `

                    <div class="col-md-4 mb-4">

                        <div class="panel text-center h-100">

                            <div style="font-size:60px;">
                                👤
                            </div>

                            <h3 class="mt-3">

                                ${p.nombre}

                            </h3>

                            <p class="text-secondary">

                                Jugador ${index + 1}

                            </p>

                            <div class="badge bg-primary p-2 fs-6">

                                ${p.puntos} pts

                            </div>

                        </div>

                    </div>
                `;
            });
        });

        // ======================================================
        // GAME STARTED
        // ======================================================

        socket.on('game_started', () => {

            const status =
                document.getElementById('statusText');

            status.innerText = 'Iniciando';

            setTimeout(() => {

                window.location.href =
                    '/views/game.html';

            }, 1000);
        });

    </script>

</body>

</html>
