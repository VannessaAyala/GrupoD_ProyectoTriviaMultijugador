<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Trivia Live - Juego</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="container py-5">

        <!-- HEADER -->
        <div class="main-card">

            <div class="title text-center mb-5">

                <h1>
                    🎮 TRIVIA LIVE
                </h1>

                <p>
                    Responde correctamente y gana puntos
                </p>

            </div>

            <!-- TOP INFO -->
            <div class="row g-4 mb-5">

                <!-- TIMER -->
                <div class="col-md-4">

                    <div class="panel text-center">

                        <h3 class="mb-3">
                            ⏳ Tiempo
                        </h3>

                        <h1 id="timer">
                            ⏳ Tiempo: 10
                        </h1>

                    </div>

                </div>

                <!-- STATUS -->
                <div class="col-md-4">

                    <div class="panel text-center">

                        <h3 class="mb-3">
                            🟢 Estado
                        </h3>

                        <h1>
                            En juego
                        </h1>

                    </div>

                </div>

                <!-- MODE -->
                <div class="col-md-4">

                    <div class="panel text-center">

                        <h3 class="mb-3">
                            🏆 Modo
                        </h3>

                        <h1>
                            Trivia
                        </h1>

                    </div>

                </div>

            </div>

            <!-- GAME -->
            <div class="panel mb-5">

                <div id="game" class="text-center">

                    <h2>
                        Esperando preguntas...
                    </h2>

                </div>

            </div>

            <!-- RANKING -->
            <div class="panel">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>
                        🏆 Ranking en vivo
                    </h2>

                    <span class="badge bg-success p-3 fs-6">
                        EN VIVO
                    </span>

                </div>

                <ul id="ranking"
                    class="list-group list-group-flush">

                </ul>

            </div>

        </div>

    </div>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- GAME -->
    <script src="../js/game.js"></script>

</body>

</html>
