events {
    # Bloque obligatorio en la configuración general
}

http {
    # Log que muestra explícitamente qué nodo del clúster (upstream) atendió
    # cada petición, y desde qué IP llegó — clave para verificar el balanceo.
    log_format balanceo '$remote_addr -> nodo:$upstream_addr '
                         '[$time_local] "$request" status:$status '
                         'tiempo_upstream:$upstream_response_time s';

    access_log /dev/stdout balanceo;

    # Permite detectar si la solicitud es un "upgrade" a WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Grupo de nodos del servidor de trivia.
    upstream cluster_trivia {
        least_conn;
        server nodo1:3000;
        server nodo2:3000;
        server nodo3:3000;
        server nodo4:3000;
        server nodo5:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://cluster_trivia;

            # Necesario para permitir el upgrade HTTP -> WebSocket que usa Socket.IO
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Conserva la información de la solicitud original
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Las partidas pueden durar varios minutos con la conexión abierta;
            # el timeout por defecto (60s) cortaría el socket a mitad de juego.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Si un nodo no responde o falla, intenta con el siguiente
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}